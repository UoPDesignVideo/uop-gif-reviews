const SIZES = ["970x250", "728x90", "300x600", "300x250", "160x600", "320x50", "320x100", "336x280"];
const KEY = "gif-review-sr01949837-third-party-idp";
let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
const byFile = Object.fromEntries(GIFS.map(g => [g.file, g]));
let size = SIZES[0], course = "";
const sizesEl = document.getElementById("sizes"), grid = document.getElementById("grid");
const status = f => (marks[f] || {}).s || "";

// Replaying a GIF: a fresh blob: URL makes the browser start the animation from frame 1
const blobs = {}, urls = {};
async function freshUrl(g) {
  if (!blobs[g.file]) blobs[g.file] = await (await fetch(g.src)).blob();
  return URL.createObjectURL(blobs[g.file]);
}
async function replay(img, g) {
  try { const u = await freshUrl(g); if (urls[img.dataset.k]) URL.revokeObjectURL(urls[img.dataset.k]); urls[img.dataset.k] = u; img.src = u; }
  catch (e) { img.src = ""; img.src = g.src; }
}

function sizeButtons() {
  sizesEl.innerHTML = "";
  [...SIZES, "All"].forEach(s => {
    const b = document.createElement("button"); b.type = "button";
    const list = GIFS.filter(g => s == "All" || g.size == s), ok = list.filter(g => status(g.file) == "ok").length;
    b.textContent = `${s} (${ok}/${list.length})`;
    b.className = (s == "All" ? "" : s) == size ? "on" : "";
    b.onclick = () => { size = s == "All" ? "" : s; sizeButtons(); render(); };
    sizesEl.appendChild(b);
  });
}
const sel = document.getElementById("course");
sel.innerHTML = '<option value="">All courses</option>' + [...new Set(GIFS.map(g => g.course))].map(c => `<option>${c.replace(/&/g, "&amp;")}</option>`).join("");
sel.onchange = () => { course = sel.value; render(); };
document.getElementById("show").onchange = render;
function visible() {
  const show = document.getElementById("show").value;
  return GIFS.filter(g => (!size || g.size == size) && (!course || g.course == course) &&
    (show == "all" || (show == "todo" ? !status(g.file) : status(g.file) == show)));
}
function render() {
  const list = visible();
  const w = size ? +size.split("x")[0] : 340;
  document.documentElement.style.setProperty("--col", Math.min(Math.max(w + 22, 200), 1000) + "px");
  grid.innerHTML = list.length ? "" : '<div class="empty">Nothing to show</div>';
  list.forEach(g => {
    const m = marks[g.file] || {};
    const c = document.createElement("div"); c.className = "card " + (m.s || "");
    c.innerHTML = `<div class="img"><img loading="lazy" width="${g.w}" height="${g.h}" alt="">
        <button class="replay" type="button" title="Play this GIF again">↻ Replay</button></div>
      <div class="meta"><b></b> · ${g.size}<br>${g.file}</div>
      <div class="marks"><button class="okb ${m.s == "ok" ? "on" : ""}" type="button">OK</button><button class="fixb ${m.s == "fix" ? "on" : ""}" type="button">Amends</button></div>
      <textarea placeholder="What amends would you like?" class="${(m.n || "").trim() ? "has" : ""}"></textarea>`;
    const img = c.querySelector("img"); img.src = g.src; img.dataset.k = "card-" + g.file;
    c.querySelector(".meta b").textContent = g.course;
    c.querySelector("textarea").value = m.n || "";
    c.querySelector(".img").onclick = e => { if (!e.target.closest(".replay")) openLb(g); };
    c.querySelector(".replay").onclick = () => replay(img, g);
    const set = s => { const cur = marks[g.file] || {}; marks[g.file] = cur.s == s ? { n: cur.n } : { s, n: cur.n };
      if (!marks[g.file].s && !(marks[g.file].n || "").trim()) delete marks[g.file]; save(); render(); sizeButtons();
      if (s == "fix" && status(g.file) == "fix") { const t = grid.querySelector(`[data-f="${g.file}"] textarea`); if (t) t.focus(); } };
    c.dataset.f = g.file;
    c.querySelector(".okb").onclick = () => set("ok");
    c.querySelector(".fixb").onclick = () => set("fix");
    c.querySelector("textarea").oninput = e => { marks[g.file] = { s: (marks[g.file] || {}).s || "fix", n: e.target.value };
      c.className = "card " + marks[g.file].s; c.querySelector(".fixb").classList.toggle("on", marks[g.file].s == "fix"); save(); stats(); };
    grid.appendChild(c);
  });
  stats();
}
function stats() {
  const all = GIFS.filter(g => !size || g.size == size);
  const ok = all.filter(g => status(g.file) == "ok").length, fix = all.filter(g => status(g.file) == "fix").length;
  document.getElementById("stats").textContent = `${all.length} GIFs · ${ok} OK · ${fix} with amends · ${all.length - ok - fix} not reviewed`;
  renderBulk();
}

let armed = false;
const targets = () => visible().filter(g => !status(g.file));
function renderBulk() {
  const b = document.getElementById("bulk"), n = targets().length;
  b.hidden = n == 0; b.className = armed ? "go" : "";
  b.textContent = armed ? `Click again to mark ${n} OK` : `Mark ${n} unreviewed as OK`;
}
document.getElementById("bulk").onclick = () => {
  if (!armed) { armed = true; renderBulk(); setTimeout(() => { armed = false; renderBulk(); }, 4000); return; }
  armed = false; targets().forEach(g => { marks[g.file] = { s: "ok", n: (marks[g.file] || {}).n }; }); save(); render(); sizeButtons();
};

function openLb(g) {
  const lb = document.getElementById("lb"), img = lb.querySelector("img"); img.dataset.k = "lb";
  img.src = g.src; replay(img, g);
  lb.querySelector(".cap").textContent = g.course + " · " + g.size + " · click to close";
  lb.style.display = "flex";
}
document.getElementById("lb").onclick = e => { e.currentTarget.style.display = "none"; };

function notesText() {
  const ok = GIFS.filter(g => status(g.file) == "ok"), fix = GIFS.filter(g => status(g.file) == "fix");
  const lines = [`SR01949837 Third Party IDP GIFs: ${ok.length} of ${GIFS.length} OK, ${fix.length} with amends, ${GIFS.length - ok.length - fix.length} not reviewed`];
  const note = g => ((marks[g.file] || {}).n || "").trim().replace(/\s*\n\s*/g, " / ");
  if (fix.length) { lines.push("", "AMENDS"); fix.forEach(g => lines.push(`${g.course} ${g.size}: ${note(g) || "(no note)"}`)); }
  const okNotes = ok.filter(g => ((marks[g.file] || {}).n || "").trim());
  if (okNotes.length) { lines.push("", "OK, WITH COMMENTS"); okNotes.forEach(g => lines.push(`${g.course} ${g.size}: ${note(g)}`)); }
  const todo = GIFS.filter(g => !status(g.file));
  if (todo.length) { lines.push("", "NOT REVIEWED"); todo.forEach(g => lines.push(`${g.course} ${g.size}`)); }
  return lines.join("\n");
}
document.getElementById("copy").onclick = () => {
  const t = notesText(), btn = document.getElementById("copy");
  const done = () => { btn.textContent = "Copied – paste into an email or Hornbill"; setTimeout(() => btn.textContent = "Copy notes", 3000); };
  const show = () => { const box = document.getElementById("copybox"), ta = document.getElementById("copytext"); ta.value = t; box.style.display = "flex"; ta.select(); };
  try { navigator.clipboard.writeText(t).then(done, show); } catch (e) { show(); }
};
document.getElementById("replayall").onclick = () => {
  grid.querySelectorAll(".card").forEach(c => { const img = c.querySelector("img"); replay(img, byFile[c.dataset.f]); });
};
document.getElementById("copyclose").onclick = () => { document.getElementById("copybox").style.display = "none"; };
document.getElementById("clear").onclick = () => {
  if (confirm("Clear all your OK / Amends marks and notes?")) { marks = {}; save(); render(); sizeButtons(); }
};
document.addEventListener("keydown", e => { if (e.key == "Escape") ["lb", "copybox"].forEach(id => document.getElementById(id).style.display = "none"); });
sizeButtons(); render();
</script></body></html>
